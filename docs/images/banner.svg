<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%" height="100%">
  <defs>
    <clipPath id="cardClip">
      <rect width="1280" height="360" rx="24" ry="24" />
    </clipPath>

    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0d101a" />
      <stop offset="60%" stop-color="#07080c" />
      <stop offset="100%" stop-color="#030305" />
    </radialGradient>

    <radialGradient id="auroraLeft" cx="20%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraCenter" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraRight" cx="80%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="branchA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="branchB" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1280" height="360" rx="24" ry="24" fill="url(#bgGrad)" stroke="#1e2233" stroke-width="1.5" />

    <rect width="1280" height="360" fill="url(#auroraLeft)" />
    <rect width="1280" height="360" fill="url(#auroraCenter)" />
    <rect width="1280" height="360" fill="url(#auroraRight)" />

    <g opacity="0.45">
      <path d="M 40 160 C 200 160, 260 75, 420 70 S 640 95, 840 68 S 1100 80, 1240 120" fill="none" stroke="url(#branchA)" stroke-width="1.5" />
      <path d="M 40 160 C 220 160, 300 240, 500 245 S 780 220, 960 240 T 1240 200" fill="none" stroke="url(#branchB)" stroke-width="1.5" />
      <path d="M 200 160 Q 450 120, 640 160 T 1080 160" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3,5" opacity="0.3" />

      <path d="M 40 160 C 200 160, 260 75, 420 70 S 640 95, 840 68 S 1100 80, 1240 120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="18 160" opacity="0.85">
        <animate attributeName="stroke-dashoffset" from="356" to="0" dur="5s" repeatCount="indefinite" />
      </path>
      <path d="M 40 160 C 220 160, 300 240, 500 245 S 780 220, 960 240 T 1240 200" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="20 180" opacity="0.8">
        <animate attributeName="stroke-dashoffset" from="0" to="400" dur="7s" repeatCount="indefinite" />
      </path>
    </g>

    <g filter="url(#glow)">
      <circle cx="40" cy="160" r="5.5" fill="#818cf8">
        <animate attributeName="r" values="4.5;6.5;4.5" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="200" cy="160" r="3.5" fill="#c084fc" />
      <circle cx="420" cy="70" r="5" fill="#38bdf8">
        <animate attributeName="r" values="4;6;4" dur="2.8s" begin="0.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="500" cy="245" r="5" fill="#34d399">
        <animate attributeName="r" values="4;6;4" dur="3.2s" begin="0.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="840" cy="68" r="4.5" fill="#f472b6">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="2.6s" begin="1.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="960" cy="240" r="4.5" fill="#38bdf8">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="3.5s" begin="0.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="1240" cy="120" r="4" fill="#34d399" />
      <circle cx="1240" cy="200" r="4" fill="#fbbf24" />
    </g>

    <g text-anchor="middle">
      <text x="640" y="155" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="66" font-weight="800" letter-spacing="5" fill="url(#titleGrad)">
        OS-GRAPH
      </text>

      <text x="640" y="198" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" letter-spacing="1" fill="#94a3b8">
        Interactive Phylogenetic Galaxy of 2,083 Operating Systems
      </text>

      <text x="640" y="292" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="2" fill="#38bdf8" opacity="0.88">
        LCA PHYLOGENETIC PATHS • CANVAS 2D SPATIAL ENGINE • WIKIPEDIA INTELLIGENCE • SPEC MATRIX
      </text>
    </g>
  </g>
</svg>