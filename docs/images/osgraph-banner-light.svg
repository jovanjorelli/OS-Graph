<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%" height="100%">
  <defs>
    <clipPath id="cardClipLight">
      <rect width="1280" height="360" rx="24" ry="24" />
    </clipPath>

    <radialGradient id="bgGradLight" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </radialGradient>

    <radialGradient id="auroraLeftLight" cx="20%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraCenterLight" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraRightLight" cx="80%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="titleGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>

    <linearGradient id="branchALight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="branchBLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.3" />
    </linearGradient>

    <filter id="glowLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#cardClipLight)">
    <rect width="1280" height="360" rx="24" ry="24" fill="url(#bgGradLight)" stroke="#cbd5e1" stroke-width="1.5" />

    <rect width="1280" height="360" fill="url(#auroraLeftLight)" />
    <rect width="1280" height="360" fill="url(#auroraCenterLight)" />
    <rect width="1280" height="360" fill="url(#auroraRightLight)" />

    <g opacity="0.55">
      <path d="M 40 160 C 200 160, 260 75, 420 70 S 640 95, 840 68 S 1100 80, 1240 120" fill="none" stroke="url(#branchALight)" stroke-width="1.5" />
      <path d="M 40 160 C 220 160, 300 240, 500 245 S 780 220, 960 240 T 1240 200" fill="none" stroke="url(#branchBLight)" stroke-width="1.5" />
      <path d="M 200 160 Q 450 120, 640 160 T 1080 160" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="3,5" opacity="0.3" />

      <path d="M 40 160 C 200 160, 260 75, 420 70 S 640 95, 840 68 S 1100 80, 1240 120" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="18 160" opacity="0.85">
        <animate attributeName="stroke-dashoffset" from="356" to="0" dur="5s" repeatCount="indefinite" />
      </path>
      <path d="M 40 160 C 220 160, 300 240, 500 245 S 780 220, 960 240 T 1240 200" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="20 180" opacity="0.8">
        <animate attributeName="stroke-dashoffset" from="0" to="400" dur="7s" repeatCount="indefinite" />
      </path>
    </g>

    <g filter="url(#glowLight)">
      <circle cx="40" cy="160" r="5.5" fill="#6366f1">
        <animate attributeName="r" values="4.5;6.5;4.5" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="200" cy="160" r="3.5" fill="#8b5cf6" />
      <circle cx="420" cy="70" r="5" fill="#0284c7">
        <animate attributeName="r" values="4;6;4" dur="2.8s" begin="0.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="500" cy="245" r="5" fill="#059669">
        <animate attributeName="r" values="4;6;4" dur="3.2s" begin="0.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="840" cy="68" r="4.5" fill="#e11d48">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="2.6s" begin="1.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="960" cy="240" r="4.5" fill="#0284c7">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="3.5s" begin="0.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="1240" cy="120" r="4" fill="#059669" />
      <circle cx="1240" cy="200" r="4" fill="#d97706" />
    </g>

    <g text-anchor="middle">
      <text x="640" y="155" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="66" font-weight="800" letter-spacing="5" fill="url(#titleGradLight)">
        OS-GRAPH
      </text>

      <text x="640" y="198" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" letter-spacing="1" fill="#64748b">
        Interactive Phylogenetic Galaxy of 2,083 Operating Systems
      </text>

      <text x="640" y="292" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="2" fill="#0284c7" opacity="0.88">
        LCA PHYLOGENETIC PATHS • CANVAS 2D SPATIAL ENGINE • WIKIPEDIA INTELLIGENCE • SPEC MATRIX
      </text>
    </g>
  </g>
</svg>